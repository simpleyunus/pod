# POD — production stack. Self-contained: Caddy terminates TLS and is the
# only service that publishes ports, so a fresh droplet needs nothing but
# Docker and this file.
#
#   cp .env.production.example .env   → fill in every value
#   docker compose -f docker-compose.prod.yml up -d --build
#
# See DEPLOY.md for the DigitalOcean walkthrough.
name: pod-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nightly logical backups of Postgres; keeps 7 daily / 4 weekly / 6 monthly.
  pgbackups:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pod}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - pgbackups:/backups

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    # No published ports. Caddy proxies the S3 API at minio:9000 over the
    # compose network; the :9001 admin console is reachable from nowhere.

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in .env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data

  clamav:
    image: clamav/clamav:stable-debian
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav

  # Renders the RTMS register set (R1-R17) to PDF for the audit pack.
  # Internal only: nothing outside the compose network needs to reach it.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gotenberg:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pod}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      WEB_ORIGIN: ${PUBLIC_SCHEME:-https}://${WEB_HOSTNAME:?set in .env}
      # MinIO / S3
      S3_ENDPOINT: http://minio:9000
      # Where the BROWSER reaches MinIO. Download links are signed against
      # this, so it must be publicly resolvable — see DEPLOY.md.
      S3_PUBLIC_ENDPOINT: ${PUBLIC_SCHEME:-https}://${FILES_HOSTNAME:?set in .env}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-pod-media}
      # Meilisearch
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # ClamAV
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # Gotenberg — PDF rendering for the RTMS audit pack. Inside the compose
      # network it listens on 3000; the dev default is localhost:3001, which
      # would resolve to nothing inside this container.
      GOTENBERG_URL: http://gotenberg:3000
      # WhatsApp — flip WHATSAPP_MODE to "meta" when credentials arrive
      WHATSAPP_MODE: ${WHATSAPP_MODE:-log}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-pod-verify-token}
      # Sage — set both to enable direct push; CSV export works regardless
      SAGE_CLIENT_ID: ${SAGE_CLIENT_ID:-}
      SAGE_CLIENT_SECRET: ${SAGE_CLIENT_SECRET:-}
      SAGE_REDIRECT_URI: ${SAGE_REDIRECT_URI:-}
      SAGE_SALES_LEDGER_CODE: ${SAGE_SALES_LEDGER_CODE:-}
      SAGE_TAX_RATE_ID: ${SAGE_TAX_RATE_ID:-}
      SAGE_BANK_ACCOUNT_ID: ${SAGE_BANK_ACCOUNT_ID:-}
      # Ops tuning
      STALLED_DAYS: ${STALLED_DAYS:-7}
      FX_RATES_USD: ${FX_RATES_USD:-{"USD":1}}
    # No published ports — reached as api:4000 through Caddy.

  web:
    build:
      context: ./apps/web
      args:
        # Baked into the browser bundle at BUILD time — changing it later
        # requires a rebuild, not a restart.
        NEXT_PUBLIC_API_URL: ${PUBLIC_SCHEME:-https}://${API_HOSTNAME:?set in .env}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
    # No published ports — reached as web:3000 through Caddy.

  # One-shot seeder. Postgres publishes no port, so the seed cannot be run
  # from the host; this reaches it over the compose network instead. It is
  # behind a profile, so it never starts with the stack:
  #     docker compose -f docker-compose.prod.yml --profile tools run --rm seed
  # Built from the api image's build stage because the runtime image omits
  # devDependencies, and the seed runs through ts-node.
  seed:
    profiles: ["tools"]
    build:
      context: ./apps/api
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pod}
    command: ["npx", "prisma", "db", "seed"]

  # The only service with published ports. Terminates TLS for all three
  # hostnames and issues certificates on first request.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - minio
    environment:
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      WEB_HOSTNAME: ${WEB_HOSTNAME:?set in .env}
      API_HOSTNAME: ${API_HOSTNAME:?set in .env}
      FILES_HOSTNAME: ${FILES_HOSTNAME:?set in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:?set in .env}
      # Set CADDY_CA_DIRECTIVE to "acme_ca https://acme-staging-v02.api.letsencrypt.org/directory"
      # while testing DNS, to avoid Let's Encrypt rate limits.
      CADDY_CA_DIRECTIVE: ${CADDY_CA_DIRECTIVE:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing on every
      # restart, which hits Let's Encrypt rate limits fast.
      - caddydata:/data
      - caddyconfig:/config

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  pgbackups:
  redisdata:
  miniodata:
  meilidata:
  clamdb:
