# POD — production stack.
#   cp .env.production.example .env   → fill in secrets
#   docker compose -f docker-compose.prod.yml up -d --build
# Put a reverse proxy (Caddy/nginx/Traefik) with TLS in front of web:3000
# and api:4000, or expose only web and route /api through it.
name: pod-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nightly logical backups of Postgres; keeps 7 daily / 4 weekly / 6 monthly.
  pgbackups:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pod}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - pgbackups:/backups

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in .env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data

  clamav:
    image: clamav/clamav:stable-debian
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pod}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      WEB_ORIGIN: ${WEB_ORIGIN:?set in .env}
      # MinIO / S3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-pod-media}
      # Meilisearch
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # ClamAV
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # WhatsApp — flip WHATSAPP_MODE to "meta" when credentials arrive
      WHATSAPP_MODE: ${WHATSAPP_MODE:-log}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-pod-verify-token}
      # Sage — set both to enable direct push; CSV export works regardless
      SAGE_CLIENT_ID: ${SAGE_CLIENT_ID:-}
      SAGE_CLIENT_SECRET: ${SAGE_CLIENT_SECRET:-}
      SAGE_REDIRECT_URI: ${SAGE_REDIRECT_URI:-}
      SAGE_SALES_LEDGER_CODE: ${SAGE_SALES_LEDGER_CODE:-}
      SAGE_TAX_RATE_ID: ${SAGE_TAX_RATE_ID:-}
      SAGE_BANK_ACCOUNT_ID: ${SAGE_BANK_ACCOUNT_ID:-}
      # Ops tuning
      STALLED_DAYS: ${STALLED_DAYS:-7}
      FX_RATES_USD: ${FX_RATES_USD:-{"USD":1}}
    ports:
      - "4000:4000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set in .env}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  pgbackups:
  redisdata:
  miniodata:
  meilidata:
  clamdb:
